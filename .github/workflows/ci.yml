name: test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a running deploy finishes before the next starts
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (app files only) and stamp the offline-cache version
        run: |
          mkdir _site
          cp -r index.html style.css meter.js app.js sw.js manifest.webmanifest icons _site/
          sed -i "s/^const VERSION = \".*\";/const VERSION = \"metronome-${GITHUB_SHA::7}\";/" _site/sw.js
          grep -q "metronome-${GITHUB_SHA::7}" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
